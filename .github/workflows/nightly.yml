name: Nightly build

on:
  push:
    branches: [ "godot" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build exports
        run: bash exports/actions_build.sh

      - name: Upload Windows export
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: exports/SECRET.windows.exe

      - name: Upload Linux export
        uses: actions/upload-artifact@v4
        with:
          name: linux_x86.64
          path: exports/SECRET.linux.x86_64

      - name: Upload Linux Arm export
        uses: actions/upload-artifact@v4
        with:
          name: linux_arm
          path: exports/SECRET.linux.arm

      - name: Upload macOS export
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: exports/SECRET.macos.zip
          
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web export
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'exports/web/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
